name: BukuSuara Smoke Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  config-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check BukuSuara defaults
        run: python tools/smoke_check.py
      - name: Install minimal test dependencies
        run: python -m pip install "google-genai>=2.24.0,<3.0.0" ruff
      - name: Ruff undefined-name audit
        run: ruff check app.py lib tools --select F601,F602,F621,F622,F631,F632,F811,F821,F822,F823,B006,B008,B017,B023,B025,B026,B032 --target-version py312
      - name: Test Gemini pronunciation logic
        run: python tools/test_gemini_pronunciation.py
      - name: Audit responsive UI
        run: python tools/ui_audit.py
      - name: Test real FFmpeg metadata export
        run: python tools/audio_metadata_smoke.py

      - name: Audit Gradio callback arity
        run: python tools/callback_audit.py


  windows-bootstrap-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Windows launcher version path
        shell: cmd
        run: ebook2audiobook.cmd --version
      - name: Check launcher from special-character path
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Buku & Suara Test'
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          New-Item -ItemType Directory -Path $target | Out-Null
          Copy-Item -Path .\* -Destination $target -Recurse -Force
          $dummy = Join-Path $target 'Contoh & Buku.epub'
          New-Item -ItemType File -Path $dummy | Out-Null
          & (Join-Path $target 'ebook2audiobook.cmd') --ebook $dummy --version
          if ($LASTEXITCODE -ne 0) {
            throw "Launcher gagal pada path dengan spasi/ampersand: $LASTEXITCODE"
          }
      - name: Check BukuSuara wrapper with special characters
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Buku & Suara Wrapper'
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          New-Item -ItemType Directory -Path $target | Out-Null
          Copy-Item -Path .\* -Destination $target -Recurse -Force
          $dummy = Join-Path $target 'Contoh & Buku.epub'
          New-Item -ItemType File -Path $dummy | Out-Null
          & (Join-Path $target 'BukuSuara.cmd') --ebook $dummy --version
          if ($LASTEXITCODE -ne 0) {
            throw "BukuSuara.cmd gagal pada path khusus: $LASTEXITCODE"
          }

      - name: Check browser helper timeout behavior
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\.bh.ps1 -HostName 127.0.0.1 -Port 9 -TimeoutSeconds 5
          $helperExit = $LASTEXITCODE
          if ($helperExit -ne 1) {
            throw "Expected browser helper timeout exit code 1, got $helperExit"
          }
          exit 0
