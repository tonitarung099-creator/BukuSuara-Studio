name: BukuSuara Smoke Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  config-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check BukuSuara defaults
        run: python tools/smoke_check.py
      - name: Install minimal test dependencies
        run: python -m pip install "google-genai>=2.24.0,<3.0.0" ruff
      - name: Ruff undefined-name audit
        run: ruff check app.py lib tools --select F601,F602,F621,F622,F631,F632,F811,F821,F822,F823 --target-version py312
      - name: Test Gemini pronunciation logic
        run: python tools/test_gemini_pronunciation.py
      - name: Audit responsive UI
        run: python tools/ui_audit.py
